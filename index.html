<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AOT&Stuff</title>

<!-- PWA: installability -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14131a">

<!-- PWA: iOS-specific install support (Android reads the manifest above) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AOT&Stuff">
<link rel="apple-touch-icon" href="aot_logo.png">
<link rel="icon" href="aot_logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Libre+Franklin:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#14131a;
  --surface:#1e1c26;
  --surface-2:#272531;
  --surface-3:#322f3d;
  --line:#3a3747;
  --text:#f2efe9;
  --text-dim:#a9a5b8;
  --text-faint:#6f6b80;
  --gold:#e8a33d;
  --gold-dim:#8a6329;
  --red:#c1443c;
  --teal:#3f8c82;
  --blue:#4f7ba3;
  --font-display:'Anton', 'Arial Narrow', sans-serif;
  --font-body:'Libre Franklin', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', 'Courier New', monospace;
  --radius:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 8%, rgba(232,163,61,0.05), transparent 40%),
    radial-gradient(circle at 85% 15%, rgba(63,140,130,0.06), transparent 45%);
}
button{font-family:inherit; cursor:pointer;}
input{font-family:inherit;}
a{color:var(--gold);}
::selection{background:var(--gold); color:#14131a;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- shell ---------- */
#app{max-width:1120px; margin:0 auto; padding-bottom:64px;}
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(20,19,26,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{
  max-width:1120px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.brand{display:flex; align-items:baseline; gap:8px; cursor:pointer; white-space:nowrap; min-width:0;}
.brand-mark{font-family:var(--font-display); font-size:26px; letter-spacing:1px; color:var(--gold); white-space:nowrap;}
.brand-mark-sub{font-family:var(--font-body); font-size:13px; font-weight:600; letter-spacing:.01em; color:var(--text-faint); opacity:.55; margin-left:7px; white-space:nowrap;}
@media(max-width:480px){
  .brand-mark-sub{font-size:10px; margin-left:5px;}
  .brand-mark{font-size:20px;}
  .topbar-inner{padding:12px 14px;}
}

.nav{display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:999px; border:1px solid var(--line);}
.nav button{
  display:flex; align-items:center; gap:6px;
  background:none; border:none; color:var(--text-dim);
  padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;
  transition:background .15s, color .15s;
}
.nav button svg{width:15px; height:15px; flex:none;}
.nav button span{display:none;}
@media(min-width:640px){.nav button span{display:inline;}}
.nav button.active{background:var(--gold); color:#1a1509;}
.nav button:not(.active):hover{background:var(--surface-2); color:var(--text);}

/* .marquee-strip{
  height:5px;
  background-image:repeating-radial-gradient(circle at 8px 3px, var(--gold-dim) 0 1.4px, transparent 1.6px 16px);
  opacity:.7;
} */

.content{padding:22px 20px 10px;}
.view-title{font-family:var(--font-display); font-size:22px; letter-spacing:.5px; margin:0 0 4px; color:var(--text);}
.view-sub{color:var(--text-faint); font-size:13px; margin:0 0 20px;}
.section{margin-bottom:34px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-head h2{font-family:var(--font-display); font-size:16px; letter-spacing:.6px; margin:0; color:var(--text); text-transform:uppercase;}
.section-head .count{font-size:11px; color:var(--text-faint); font-family:var(--font-mono);}
.link-btn{background:none; border:none; color:var(--gold); font-size:12px; font-weight:600;}
.link-btn:hover{text-decoration:underline;}

/* ---------- empty states ---------- */
.empty{
  border:1px dashed var(--line); border-radius:var(--radius); padding:34px 20px;
  text-align:center; color:var(--text-faint); font-size:13px;
}
.empty strong{color:var(--text-dim); display:block; margin-bottom:4px; font-size:14px;}

/* ---------- stats strip ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:10px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 14px;}
.stat .num{font-family:var(--font-display); font-size:24px; color:var(--gold); line-height:1;}
.stat .lbl{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:5px;}

/* ---------- horizontal scroller ---------- */
.hscroll{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x proximity;}
.hscroll::-webkit-scrollbar{height:6px;}

/* ---------- ticket card (signature element) ---------- */
.ticket{
  position:relative;
  flex:none; width:220px; scroll-snap-align:start;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  display:flex; overflow:hidden; cursor:pointer;
  transition:transform .15s, border-color .15s;
}
.ticket:hover{transform:translateY(-2px); border-color:var(--gold-dim);}
.ticket-poster{width:64px; flex:none; background:var(--surface-3); background-size:cover; background-position:center;}
.ticket-body{flex:1; padding:10px 10px 10px 12px; min-width:0; display:flex; flex-direction:column; justify-content:space-between;}
.ticket-title{font-size:13px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ticket-ep{font-family:var(--font-mono); font-size:11px; color:var(--gold); margin-top:2px;}
.ticket-stub{
  flex:none; width:34px; border-left:2px dashed var(--line);
  display:flex; align-items:center; justify-content:center; position:relative;
}
.ticket-stub::before, .ticket-stub::after{
  content:''; position:absolute; left:-8px; width:16px; height:16px; border-radius:50%;
  background:var(--bg); border:1px solid var(--line);
}
.ticket-stub::before{top:-8px;}
.ticket-stub::after{bottom:-8px;}
.ticket-stub-btn{
  background:var(--gold); color:#1a1509; border:none; border-radius:6px;
  width:24px; height:24px; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:15px;
}
.ticket-stub-btn:hover{background:#f4b859;}
.ticket-progress{height:3px; background:var(--surface-3); border-radius:2px; margin-top:6px; overflow:hidden;}
.ticket-progress > i{display:block; height:100%; background:var(--teal);}

/* ---------- this week list ---------- */
.week-row{
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px;
  cursor:pointer;
}
.week-row:hover{border-color:var(--gold-dim);}
.week-date{
  font-family:var(--font-mono); font-size:11px; color:var(--gold); background:var(--surface-2);
  border-radius:6px; padding:6px 8px; text-align:center; width:46px; flex:none; line-height:1.15;
}
.week-date b{display:block; font-size:15px; color:var(--text);}
.week-thumb{width:40px; height:40px; border-radius:6px; background:var(--surface-3); background-size:cover; background-position:center; flex:none;}
.week-title{font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.week-ep{font-family:var(--font-mono); font-size:11px; color:var(--text-faint);}

/* ---------- filter tabs ---------- */
.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px;}
.tabs button{
  flex:none; background:var(--surface); border:1px solid var(--line); color:var(--text-dim);
  padding:7px 13px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap;
}
.tabs button.active{background:var(--gold); color:#1a1509; border-color:var(--gold);}

/* ---------- poster grid ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:14px;}
.gcard{cursor:pointer; position:relative;}
.gcard-poster{
  width:100%; aspect-ratio:2/3; border-radius:8px; background:var(--surface-2);
  background-size:cover; background-position:center; border:1px solid var(--line);
  display:flex; align-items:flex-end; overflow:hidden; position:relative;
}
.gcard-badge{
  position:absolute; top:6px; right:6px; background:rgba(20,19,26,.85); color:var(--gold);
  font-size:10px; font-family:var(--font-mono); padding:2px 6px; border-radius:5px; border:1px solid var(--gold-dim);
}
.gcard-bar{height:4px; width:100%; background:rgba(0,0,0,.5);}
.gcard-bar > i{display:block; height:100%; background:var(--teal);}
.gcard-title{font-size:12px; font-weight:600; margin-top:6px; line-height:1.25; color:var(--text);}
.gcard-sub{font-size:11px; color:var(--text-faint); margin-top:1px;}
.gcard-add{
  position:absolute; bottom:6px; right:6px; width:26px; height:26px; border-radius:50%;
  background:var(--gold); color:#1a1509; border:none; font-weight:800; font-size:16px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.4);
}

/* ---------- search bar ---------- */
.searchbar{
  display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:10px 14px; margin-bottom:20px;
}
.searchbar svg{width:17px; height:17px; color:var(--text-faint); flex:none;}
.searchbar input{background:none; border:none; outline:none; color:var(--text); font-size:14px; width:100%;}
.searchbar input::placeholder{color:var(--text-faint);}

/* ---------- detail view ---------- */
.detail-hero{display:flex; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
.detail-poster{width:150px; flex:none; aspect-ratio:2/3; border-radius:10px; background:var(--surface-2); background-size:cover; background-position:center; border:1px solid var(--line);}
.detail-info{flex:1; min-width:220px;}
.detail-info h1{font-family:var(--font-display); font-size:26px; margin:0 0 4px; letter-spacing:.3px;}
.detail-meta{font-size:12px; color:var(--text-faint); margin-bottom:10px; font-family:var(--font-mono);}
.detail-overview{font-size:13px; color:var(--text-dim); line-height:1.55; max-width:60ch;}
.genre-pills{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
.genre-pill{font-size:11px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); padding:3px 9px; border-radius:999px;}

.status-row{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0;}
.status-btn{
  background:var(--surface); border:1px solid var(--line); color:var(--text-dim);
  padding:7px 12px; border-radius:8px; font-size:12px; font-weight:700;
}
.status-btn.active{background:var(--teal); border-color:var(--teal); color:#0d1f1d;}
.status-btn[data-status="watching"].active{background:var(--gold); border-color:var(--gold); color:#1a1509;}
.status-btn[data-status="dropped"].active{background:var(--red); border-color:var(--red); color:#2a0e0c;}
.status-btn[data-status="up_to_date"].active{background:var(--blue); border-color:var(--blue); color:#0c1e2c;}

.punchcard{display:flex; align-items:center; gap:10px; margin:16px 0;}
.punchcard-label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em;}
.punch-row{display:flex; gap:4px;}
.punch{
  width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); background:none;
  transition:background .1s, border-color .1s;
}
.punch.on{background:var(--gold); border-color:var(--gold);}
.punch-num{font-family:var(--font-mono); font-size:12px; color:var(--gold); min-width:16px;}

.overall-progress{margin:16px 0 6px;}
.overall-progress .bar{height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden; border:1px solid var(--line);}
.overall-progress .bar > i{display:block; height:100%; background:linear-gradient(90deg, var(--teal), #58b5a9);}
.overall-progress .lbl{font-size:11px; color:var(--text-faint); margin-top:5px; font-family:var(--font-mono);}

.season{border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; background:var(--surface);}
.season-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer;}
.season-head:hover{background:var(--surface-2);}
.season-head-left{display:flex; align-items:center; gap:10px;}
.season-head h3{font-size:13px; margin:0; font-weight:700;}
.season-progress-mini{font-family:var(--font-mono); font-size:11px; color:var(--text-faint);}
.season-actions{display:flex; gap:6px; align-items:center;}
.mini-btn{background:var(--surface-3); border:1px solid var(--line); color:var(--text-dim); font-size:11px; padding:4px 8px; border-radius:6px; font-weight:600; display:inline-flex; align-items:center; gap:4px;}
.mini-btn:hover{color:var(--text);}
.mini-btn svg{width:12px; height:12px; flex:none;}
.chevron{width:14px; height:14px; transition:transform .15s; color:var(--text-faint);}
.season.open .chevron{transform:rotate(90deg);}
.episodes{display:none; border-top:1px solid var(--line);}
.season.open .episodes{display:block;}
.episode-row{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--surface-2); font-size:12px; cursor:pointer;}
.episode-row:hover{background:var(--surface-2);}
.episode-row:last-child{border-bottom:none;}
.ep-check{
  width:20px; height:20px; border-radius:5px; border:1.5px solid var(--line); background:none; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.ep-check.checked{background:var(--teal); border-color:var(--teal);}
.ep-check svg{width:12px; height:12px; color:#0d1f1d; display:none;}
.ep-check.checked svg{display:block;}
.ep-check[disabled]{opacity:.25; pointer-events:none;}
.ep-num{font-family:var(--font-mono); color:var(--text-faint); width:26px; flex:none;}
.ep-name{flex:1; min-width:0; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.episode-row.not-aired .ep-name{color:var(--text-faint);}
/* .ep-date{font-family:var(--font-mono); color:var(--text-faint); font-size:11px; flex:none; width:84px; text-align:right;} */
.ep-date{
    width:56px;
    flex:none;
    text-align:right;
}
.episode-row.not-aired .ep-date{color:var(--gold-dim); font-style:italic;}
@media(max-width:480px){
  .episode-row{gap:6px; padding:9px 10px;}
  .ep-num{width:18px;}
  .ep-date{
    width:auto;
    min-width:0;
    margin-left:6px;
    font-size:9.5px;
    letter-spacing:-.01em;
  }
  .ep-date.has-label{
    width:48px;
    overflow:visible;
    text-overflow:clip;
    white-space:nowrap;
  }
  .ep-rewatch{padding:3px 5px; font-size:9px; gap:2px;}
  .ep-rewatch svg{width:10px; height:10px;}
}
/* .ep-rewatch-wrap{flex:none; display:flex; align-items:center; gap:4px;} */
.ep-rewatch-wrap{
  margin-left:auto;
}
.ep-rewatch{
  flex:none; display:flex; align-items:center; gap:4px; background:none; border:1px solid var(--line);
  color:var(--text-faint); border-radius:6px; padding:3px 7px; font-size:10px; font-weight:700;
}
.ep-rewatch svg{width:11px; height:11px; flex:none;}
.ep-rewatch:hover{color:var(--gold); border-color:var(--gold-dim);}
.ep-rewatch.has-count{color:var(--gold); border-color:var(--gold-dim);}
.ep-rewatch[disabled]{opacity:.25; pointer-events:none;}
.ep-rewatch-undo{
  flex:none; background:none; border:1px solid var(--line); color:var(--text-faint);
  border-radius:6px; width:20px; height:20px; font-size:13px; font-weight:800; line-height:1;
}
.ep-rewatch-undo:hover{color:var(--text); border-color:var(--gold-dim);}

.runtime-field{display:flex; align-items:center; gap:8px; margin:14px 0;}
.runtime-field label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.runtime-field input{
  width:64px; background:var(--surface); border:1px solid var(--line); color:var(--text);
  padding:6px 8px; border-radius:6px; font-size:12px; font-family:var(--font-mono); text-align:center;
}
.runtime-field span{font-size:11px; color:var(--text-faint);}

.movie-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:16px 0;}
.big-toggle{
  background:var(--surface); border:1px solid var(--line); color:var(--text); font-weight:700; font-size:13px;
  padding:11px 18px; border-radius:9px; display:flex; align-items:center; gap:8px;
}
.big-toggle svg{width:15px; height:15px; flex:none;}
.big-toggle.on{background:var(--teal); border-color:var(--teal); color:#0d1f1d;}
.rewatch-btn{
  background:var(--surface); border:1px solid var(--line); color:var(--text-dim); font-weight:700; font-size:12px;
  padding:8px 13px; border-radius:8px; display:inline-flex; align-items:center; gap:6px;
}
.rewatch-btn svg{width:13px; height:13px; flex:none;}
.rewatch-btn:hover{color:var(--gold); border-color:var(--gold-dim);}
.rewatch-btn.has-count{color:var(--gold); border-color:var(--gold-dim);}
.rewatch-undo{
  background:none; border:1px solid var(--line); color:var(--text-faint); border-radius:8px;
  width:28px; height:28px; font-size:15px; font-weight:800; line-height:1; flex:none;
}
.rewatch-undo:hover{color:var(--text); border-color:var(--gold-dim);}

/* ---------- episode modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,9,13,0.78); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
}
.modal-card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  max-width:480px; width:100%; max-height:86vh; overflow-y:auto; position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.modal-close{
  position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
  background:rgba(20,19,26,0.75); border:1px solid var(--line); color:var(--text);
  font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; z-index:2;
}
.modal-close:hover{background:var(--surface-3);}
.modal-still{
  width:100%; aspect-ratio:16/9; background-color:var(--surface-2); background-size:cover;
  background-position:center; border-radius:14px 14px 0 0;
}
.modal-still-empty{display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12px;}
.modal-body{padding:18px 20px 22px;}
.modal-eyebrow{font-family:var(--font-mono); font-size:11px; color:var(--gold); letter-spacing:.04em;}
.modal-title{font-family:var(--font-display); font-size:20px; margin:4px 0 8px; letter-spacing:.3px;}
.modal-meta{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--text-faint); font-family:var(--font-mono); margin-bottom:12px;}
.modal-meta .rating-loading{font-style:italic; opacity:.7;}
.modal-overview{font-size:13px; color:var(--text-dim); line-height:1.6; margin:0;}

/* ---------- settings ---------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field input[type=text], .field input[type=password]{
  width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
  padding:11px 13px; border-radius:8px; font-size:13px; font-family:var(--font-mono);
}
.field-hint{font-size:11px; color:var(--text-faint); margin-top:6px; line-height:1.5;}
.btn{
  background:var(--gold); color:#1a1509; border:none; padding:10px 18px; border-radius:8px;
  font-weight:800; font-size:13px;
}
.btn:hover{background:#f4b859;}
.btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--line);}
.btn.danger{background:var(--red); color:#2a0e0c;}
.settings-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
.settings-card h3{margin:0 0 4px; font-size:14px;}
.settings-card p{margin:0 0 12px; font-size:12px; color:var(--text-faint); line-height:1.5;}
.row-btns{display:flex; gap:8px; flex-wrap:wrap;}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--surface-2); border:1px solid var(--line); color:var(--text);

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== CONFIG ===================== */
// ↓↓↓ EDIT THESE TWO LINES ONLY — paste your own keys between the quotes ↓↓↓
const BUILT_IN_TMDB_KEY = 'fe53eddd9bc7b03414fbbdcfcbdd8f69';   // required — get one free at themoviedb.org/settings/api
const BUILT_IN_OMDB_KEY = 'cc9634ae';   // optional — leave as-is to skip IMDb ratings, or get one free at omdbapi.com/apikey.aspx
// ↑↑↑ EDIT THESE TWO LINES ONLY ↑↑↑
// These are baked into the file itself, so every friend who installs this same file/link
// uses your keys automatically — nobody has to paste their own in Settings.

const IMG = (path, size='w342') => path ? `https://image.tmdb.org/t/p/${size}${path}` : '';
const TMDB = 'https://api.themoviedb.org/3';

/* ===================== ICONS ===================== */
const ic = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
  library: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/></svg>`,
  settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  rewatch: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>`,
};

/* ===================== STATE ===================== */
let state = {
  settings: { tmdbKey: BUILT_IN_TMDB_KEY, omdbKey: BUILT_IN_OMDB_KEY },
  library: {},           // key `${type}-${id}` -> item
  view: 'home',
  detailKey: null,
  detailData: null,      // live tmdb data for current detail (merged with library item if present)
  libraryFilter: 'all',
  libraryMediaType: 'tv',
  searchQuery: '',
  searchResults: [],
  openSeasons: {},        // season_number -> bool (for current detail view)
  episodeModal: null,     // {sn, en} -> currently open episode detail modal, or null
  loading: false,
  booted: false,
};

let searchDebounce = null;

/* ===================== STORAGE ===================== */
// Tries Claude's window.storage first (works when this runs inside the Claude chat/artifact
// preview). Always mirrors to localStorage too, which is what actually persists things when
// this file is opened directly as a standalone app (downloaded, double-clicked, installed to
// a phone home screen, etc.) — that's the common case once you're using this day to day.
const LS_PREFIX = 'stubs:';
const hasCloudStorage = () => (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(hasCloudStorage()){
    try{
      const r = await window.storage.get(key, false);
      if(r) return r.value;
    }catch(e){ /* not found there, fall through to localStorage */ }
  }
  try{ return localStorage.getItem(LS_PREFIX+key); }catch(e){ return null; }
}
async function storageSet(key, value){
  let ok = false;
  if(hasCloudStorage()){
    try{ await window.storage.set(key, value, false); ok = true; }catch(e){ /* ignore, still try localStorage */ }
  }
  try{ localStorage.setItem(LS_PREFIX+key, value); ok = true; }catch(e){ /* localStorage unavailable too */ }
  return ok;
}

async function loadState(){
  try{
    const s = await storageGet('settings');
    if(s) state.settings = JSON.parse(s);
  }catch(e){ /* no settings yet */ }
  // Keys are baked into the file (see CONFIG at top) — always use those, ignoring
  // anything a previous version of the app may have saved to this device.
  state.settings.tmdbKey = BUILT_IN_TMDB_KEY;
  state.settings.omdbKey = BUILT_IN_OMDB_KEY;
  try{
    const l = await storageGet('library');
    if(l) state.library = JSON.parse(l);
  }catch(e){ /* no library yet */ }
  state.booted = true;
}
async function saveSettings(){
  const ok = await storageSet('settings', JSON.stringify(state.settings));
  if(!ok) toast('Could not save settings on this device');
}
async function saveLibrary(){
  const ok = await storageSet('library', JSON.stringify(state.library));
  if(!ok) toast('Could not save — this browser may be blocking storage');
}

/* ===================== TOAST ===================== */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===================== TMDB API ===================== */
async function tmdbFetch(path, params={}){
  if(!state.settings.tmdbKey){ throw new Error('no-key'); }
  const url = new URL(TMDB + path);
  url.searchParams.set('api_key', state.settings.tmdbKey);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  if(!res.ok){
    if(res.status === 401) throw new Error('bad-key');
    throw new Error('tmdb-error');
  }
  return res.json();
}
const searchMulti = (q) => tmdbFetch('/search/multi', {query:q, include_adult:'false'});
const getTvDetails = (id) => tmdbFetch(`/tv/${id}`);
const getMovieDetails = (id) => tmdbFetch(`/movie/${id}`);
const getSeasonDetails = (id, sn) => tmdbFetch(`/tv/${id}/season/${sn}`);
const getTvExternalIds = (id) => tmdbFetch(`/tv/${id}/external_ids`);

/* ===================== OMDb API (optional — IMDb ratings) ===================== */
// OMDb is a free community wrapper around IMDb data (omdbapi.com). It's entirely optional:
// if no key is set, or a lookup fails, callers fall back to TMDB's own rating instead.
async function omdbFetch(params){
  if(!state.settings.omdbKey) throw new Error('no-omdb-key');
  const url = new URL('https://www.omdbapi.com/');
  url.searchParams.set('apikey', state.settings.omdbKey);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  if(!res.ok) throw new Error('omdb-error');
  const data = await res.json();
  if(data.Response === 'False') throw new Error(data.Error || 'omdb-error');
  return data;
}
// Fetches every episode's imdbRating for one season in a single OMDb call, and caches
// it on the library item. Requires the show's IMDb ID, which we get for free from TMDB
// (external_ids) and cache once per show.
async function ensureImdbSeasonRatings(libItem, sn){
  if(!state.settings.omdbKey || !libItem) return;
  libItem.imdbRatings = libItem.imdbRatings || {};
  if(libItem.imdbRatings[sn]) return; // already fetched (even if empty) this session
  try{
    if(!libItem.imdbId){
      const ext = await getTvExternalIds(libItem.id);
      libItem.imdbId = ext.imdb_id || null;
    }
    if(!libItem.imdbId){ libItem.imdbRatings[sn] = {}; saveLibrary(); return; }
    const data = await omdbFetch({i: libItem.imdbId, Season: sn});
    const map = {};
    (data.Episodes||[]).forEach(ep=>{
      const en = Number(ep.Episode);
      const r = parseFloat(ep.imdbRating);
      map[en] = (!isNaN(r) && r > 0) ? r : null;
    });
    libItem.imdbRatings[sn] = map;
  }catch(e){
    libItem.imdbRatings[sn] = {}; // don't hammer OMDb retrying a season that failed/has no data
  }
  saveLibrary();
}

// Pulls every season's episode list once (air dates + TMDB's own per-episode runtime) and
// caches it on the library item, so we know which episodes have actually aired and don't
// need the user to type in an episode length by hand. Refreshed every 6h at most.
const EPISODES_META_TTL = 6*3600*1000;
async function ensureEpisodesMeta(k, showId, seasons){
  const it = state.library[k];
  if(!it) return;
  const fresh = it.episodesMeta && it.episodesMetaFetched && (Date.now()-it.episodesMetaFetched < EPISODES_META_TTL);
  if(fresh) return;
  const list = (seasons||[]).filter(s=>s.episode_count>0);
  const results = await Promise.all(list.map(s=>getSeasonDetails(showId, s.season_number).catch(()=>null)));
  const meta = {};
  results.forEach((sd,idx)=>{
    if(!sd) return;
    const sn = list[idx].season_number;
    meta[sn] = (sd.episodes||[]).map(ep=>({episode_number:ep.episode_number, 
      air_date:ep.air_date||null, 
      runtime: (typeof ep.runtime === "number" && ep.runtime > 0)
      ? ep.runtime
      : null,
      name:ep.name||null,
      overview: ep.overview || null,
      still_path: ep.still_path || null,
      vote_average: (typeof ep.vote_average === 'number' && ep.vote_average > 0) ? ep.vote_average : null}));
  });
  it.episodesMeta = meta;
  it.episodesMetaFetched = Date.now();
  saveLibrary();
}

/* ===================== HELPERS ===================== */
const keyOf = (type, id) => `${type}-${id}`;
// const RUNTIME_TV_DEFAULT = 42;

function libStatusLabel(s){
  return {plan_to_watch:'Plan to Watch', watching:'Watching', on_hold:'On Hold', dropped:'Dropped', completed:'Completed', up_to_date:'Up to Date', watched:'Watched'}[s] || s;
}

function airedCountFor(item, sn, episodeCountFallback){
  const meta = item.episodesMeta && item.episodesMeta[sn];
  if(meta && meta.length){
    const todayStr = new Date().toISOString().slice(0,10);
    return meta.filter(e=>e.air_date && e.air_date<=todayStr).length;
  }
  return episodeCountFallback||0;
}

function computeTvProgress(item){
  const seasons = (item.seasonsMeta||[]).filter(s=>s.season_number>0 || (item.seasonsMeta.length===1));
  let total=0, watched=0;
  seasons.forEach(s=>{
    total += airedCountFor(item, s.season_number, s.episode_count);
    watched += (item.watched[s.season_number]||[]).length;
  });
  return {total, watched, pct: total? Math.round(watched/total*100):0};
}

function nextEpisodeFor(item){
  const seasons = (item.seasonsMeta||[]).filter(s=>s.season_number>0).sort((a,b)=>a.season_number-b.season_number);
  const todayStr = new Date().toISOString().slice(0,10);
  for(const s of seasons){
    const sn = s.season_number;
    const watchedArr = item.watched[sn] || [];
    const meta = item.episodesMeta && item.episodesMeta[sn];
    if(meta && meta.length){
      const next = meta.find(e=>!watchedArr.includes(e.episode_number));
      if(next){
        const aired = !!next.air_date && next.air_date <= todayStr;
        return {season:sn, episode:next.episode_number, air_date:next.air_date||null, aired};
      }
    } else {
      const w = watchedArr.length;
      if(w < (s.episode_count||0)) return {season:sn, episode:w+1, air_date:null, aired:true};
    }
  }
  return null;
}

// TMDB's per-episode runtime field is frequently null, but the show-level average
// (episode_run_time) is populated for almost every show — so we use that as the one
// source of truth for time-watched math if per-episode is null, and only ask the
// person to set a number by hand when TMDB has neither.
function seriesMinutesWatched(){
  let mins = 0;

  Object.values(state.library).forEach(it => {
    if (it.type !== 'tv') return;

    Object.entries(it.watched || {}).forEach(([sn, arr]) => {
      (arr || []).forEach(en => {

        const rt = getEpisodeRuntime(it, Number(sn), en);

        if (!rt) return;

        const rewatchCount =
          (it.rewatches &&
           it.rewatches[sn] &&
           it.rewatches[sn][en]) || 0;

        mins += rt * (1 + rewatchCount);

      });
    });
  });

  return mins;
}

// function seriesMinutesWatched(){
//   let mins = 0;
//   Object.values(state.library).forEach(it=>{
//     if(it.type!=='tv') return;
//     const rt = it.episodeRuntime || RUNTIME_TV_DEFAULT;
//     Object.entries(it.watched||{}).forEach(([sn,arr])=>{
//       (arr||[]).forEach(en=>{
//         const rewatchCount = (it.rewatches && it.rewatches[sn] && it.rewatches[sn][en]) || 0;
//         mins += rt * (1 + rewatchCount);
//       });
//     });
//   });
//   return mins;
// }


function movieMinutesWatched(){
  let mins = 0;
  Object.values(state.library).forEach(it=>{
    if(it.type==='movie' && it.status==='completed'){
      const runtime = it.runtime || 100;
      mins += runtime * (1 + (it.rewatchCount||0));
    }
  });
  return mins;
}

function fmtHours(mins){
  const h = Math.floor(mins/60);
  if(h < 24) return `${h}h`;
  const d = Math.floor(h/24);
  return `${d}d ${h%24}h`;
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

function getEpisodeRuntime(item, seasonNumber, episodeNumber){
  const season = item.episodesMeta?.[seasonNumber];
  const episode = season?.find(
    e => e.episode_number === episodeNumber
  );

  // Prefer the episode's own runtime
  if (typeof episode?.runtime === "number" && episode.runtime > 0) {
    return episode.runtime;
  }

  // Otherwise use the show's runtime
  if (typeof item.episodeRuntime === "number" && item.episodeRuntime > 0) {
    return item.episodeRuntime;
  }

  return null;
}

// Decides whether we already have enough runtime info to estimate time watched, or
// whether we truly need to ask the person to set one manually. Cascade, in order:
//   1. Per-episode runtimes from TMDB (already cached on libItem.episodesMeta by
//      ensureEpisodesMeta) — if ANY episode has one, getEpisodeRuntime() will use it
//      per-episode, so no manual prompt is needed for the show as a whole.
//   2. TMDB's series-level average (episode_run_time) — used as a fallback for
//      episodes that don't have their own runtime.
//   3. Only if neither exists anywhere do we fall back to asking the person.
// Never overwrites a runtime the person already entered by hand.
function resolveEpisodeRuntimeSource(libItem, tmdbShowData){
  if(libItem.episodeRuntimeSource === 'manual') return;

  const hasAnyEpisodeRuntime = Object.values(libItem.episodesMeta || {})
    .some(season => (season||[]).some(ep => typeof ep.runtime === 'number' && ep.runtime > 0));

  if(hasAnyEpisodeRuntime){
    libItem.episodeRuntimeSource = 'tmdb';
    return;
  }

  if(tmdbShowData.episode_run_time && tmdbShowData.episode_run_time.length){
    libItem.episodeRuntime = tmdbShowData.episode_run_time[0];
    libItem.episodeRuntimeSource = 'tmdb';
    return;
  }

  libItem.episodeRuntimeSource = null;
}

/* ===================== LIBRARY MUTATIONS ===================== */
function addToLibrary(tmdbItem, type, initialStatus){
  const id = tmdbItem.id;
  const k = keyOf(type, id);
  if(state.library[k]) return k;
  const title = type==='tv' ? tmdbItem.name : tmdbItem.title;
  const item = {
    id, type, title,
    poster_path: tmdbItem.poster_path || null,
    addedAt: Date.now(),
    status: initialStatus,
    rating: null,
  };
  if(type==='tv'){
    item.watched = {};
    item.rewatches = {};       // { seasonNumber: { episodeNumber: extraWatchCount } }
    item.seasonsMeta = [];
    item.episodeRuntime = null;
    item.episodeRuntimeSource = null;   // 'tmdb' | 'manual' | null (not resolved yet)
    item.nextEpisodeToAir = null;
    item.lastFetched = 0;
    item.imdbId = null;                 // resolved lazily via TMDB external_ids
    item.imdbRatings = {};              // { seasonNumber: { episodeNumber: rating|null } }
  } else {
    item.runtime = null;
    item.runtimeSource = null;          // 'tmdb' | 'manual' | null
    item.watchedAt = null;
    item.rewatchCount = 0;
  }
  state.library[k] = item;
  saveLibrary();
  return k;
}
function removeFromLibrary(k){
  delete state.library[k];
  saveLibrary();
}
function setStatus(k, status){
  const it = state.library[k]; if(!it) return;
  it.status = status;
  if(it.type==='movie' && status==='completed' && !it.watchedAt) it.watchedAt = Date.now();
  saveLibrary(); render();
}
function setRating(k, val){
  const it = state.library[k]; if(!it) return;
  it.rating = (it.rating === val) ? null : val;
  saveLibrary(); render();
}
// Keeps a show's status honest as episodes get checked off:
//  - nothing watched            -> back to Plan to Watch
//  - some but not all aired eps -> Watching
//  - every aired episode (bar specials) watched, show still airing -> Up to Date
//  - every aired episode (bar specials) watched, show has ended     -> Completed
function autoUpdateStatus(k){
  const it = state.library[k];
  if(!it || it.type!=='tv') return;
  const totalWatchedAny = Object.values(it.watched||{}).reduce((a,arr)=>a+((arr||[]).length),0);
  if(totalWatchedAny===0){
    if(['watching','up_to_date','completed'].includes(it.status)) it.status = 'plan_to_watch';
    return;
  }
  const seasons = (it.seasonsMeta||[]).filter(s=>s.season_number>0);
  let airedTotal=0, watchedCount=0;
  seasons.forEach(s=>{
    const sn = s.season_number;
    airedTotal += airedCountFor(it, sn, s.episode_count);
    watchedCount += (it.watched[sn]||[]).length;
  });
  if(airedTotal>0 && watchedCount>=airedTotal){
    const ended = it.showStatus==='Ended' || it.showStatus==='Canceled';
    it.status = ended ? 'completed' : 'up_to_date';
  } else {
    it.status = 'watching';
  }
}
function toggleEpisode(k, sn, en){
  const it = state.library[k]; if(!it) return;
  it.watched[sn] = it.watched[sn] || [];
  const idx = it.watched[sn].indexOf(en);
  if(idx>-1){
    it.watched[sn].splice(idx,1);
    // no longer "first watched" — clear any rewatch count logged against it too
    if(it.rewatches && it.rewatches[sn]) delete it.rewatches[sn][en];
  } else {
    it.watched[sn].push(en);
  }
  autoUpdateStatus(k);
  saveLibrary(); render();
}
function logEpisodeRewatch(k, sn, en){
  const it = state.library[k]; if(!it) return;
  if(!(it.watched[sn]||[]).includes(en)) return; // can only rewatch something already watched
  it.rewatches = it.rewatches || {};
  it.rewatches[sn] = it.rewatches[sn] || {};
  it.rewatches[sn][en] = (it.rewatches[sn][en]||0) + 1;
  saveLibrary(); render();
}
function unlogEpisodeRewatch(k, sn, en){
  const it = state.library[k]; if(!it || !it.rewatches || !it.rewatches[sn]) return;
  if(!it.rewatches[sn][en]) return;
  it.rewatches[sn][en] -= 1;
  if(it.rewatches[sn][en] <= 0) delete it.rewatches[sn][en];
  saveLibrary(); render();
}
function logSeasonRewatch(k, sn){
  const it = state.library[k]; if(!it) return;
  const watchedArr = it.watched[sn] || [];
  if(!watchedArr.length) return; // nothing watched in this season yet
  it.rewatches = it.rewatches || {};
  it.rewatches[sn] = it.rewatches[sn] || {};
  watchedArr.forEach(en=>{ it.rewatches[sn][en] = (it.rewatches[sn][en]||0) + 1; });
  saveLibrary(); render();
}
function unlogSeasonRewatch(k, sn){
  const it = state.library[k]; if(!it || !it.rewatches || !it.rewatches[sn]) return;
  Object.keys(it.rewatches[sn]).forEach(en=>{
    it.rewatches[sn][en] -= 1;
    if(it.rewatches[sn][en] <= 0) delete it.rewatches[sn][en];
  });
  if(Object.keys(it.rewatches[sn]).length===0) delete it.rewatches[sn];
  saveLibrary(); render();
}
function logMovieRewatch(k){
  const it = state.library[k]; if(!it || it.status!=='completed') return;
  it.rewatchCount = (it.rewatchCount||0) + 1;
  saveLibrary(); render();
}
function unlogMovieRewatch(k){
  const it = state.library[k]; if(!it) return;
  it.rewatchCount = Math.max(0, (it.rewatchCount||0) - 1);
  saveLibrary(); render();
}
function setEpisodeRuntime(k, minutes){
  const it = state.library[k]; if(!it) return;
  const val = Math.max(1, Math.round(Number(minutes)));
  it.episodeRuntime = val;
  it.episodeRuntimeSource = 'manual';
  saveLibrary(); render();
}
function setMovieRuntime(k, minutes){
  const it = state.library[k]; if(!it) return;
  const val = Math.max(1, Math.round(Number(minutes)||100));
  it.runtime = val;
  it.runtimeSource = 'manual';
  saveLibrary(); render();
}
function markSeasonWatched(k, sn, episodeCount, allWatched){
  const it = state.library[k]; if(!it) return;
  if(allWatched){
    it.watched[sn] = [];
    if(it.rewatches) delete it.rewatches[sn]; // no episodes watched anymore, so no rewatches either
  } else {
    const meta = it.episodesMeta && it.episodesMeta[sn];
    if(meta && meta.length){
      const todayStr = new Date().toISOString().slice(0,10);
      it.watched[sn] = meta.filter(e=>e.air_date && e.air_date<=todayStr).map(e=>e.episode_number);
    } else {
      // no cached air-date data for this season yet — best effort, mark everything TMDB lists
      it.watched[sn] = Array.from({length:episodeCount}, (_,i)=>i+1);
    }
  }
  autoUpdateStatus(k);
  saveLibrary(); render();
}
function quickWatchNext(k){
  const it = state.library[k]; if(!it || it.type!=='tv') return;
  const nx = nextEpisodeFor(it);
  if(!nx){ toast('All caught up!'); return; }
  if(nx.aired===false){
    toast(nx.air_date ? `Not aired yet — airs ${nx.air_date}` : 'Not aired yet');
    return;
  }
  it.watched[nx.season] = it.watched[nx.season] || [];
  it.watched[nx.season].push(nx.episode);
  autoUpdateStatus(k);
  if(it.status==='completed'){
    toast(`${it.title} — series completed!`);
  } else if(it.status==='up_to_date'){
    toast(`${it.title} — up to date!`);
  } else {
    toast(`Marked S${nx.season}E${nx.episode} watched`);
  }
  saveLibrary(); render();
}

/* ===================== RENDER ROOT ===================== */
function render(preserveScroll){
  const app = document.getElementById('app');
  // preserveScroll defaults to true — most render() calls are the result of an
  // in-place action (toggling a watched episode, logging a rewatch, changing status,
  // etc.) and the view should stay put rather than jumping back to the top.
  const shouldPreserve = preserveScroll !== false;
  const scrollY = shouldPreserve ? window.scrollY : 0;
  if(!state.booted){
    app.innerHTML = `<div class="spinner"></div>`;
    return;
  }
  if(!state.settings.tmdbKey || state.settings.tmdbKey === 'PASTE_YOUR_TMDB_KEY_HERE'){
    app.innerHTML = renderOnboard();
    return;
  }
  app.innerHTML = `
    <div class="topbar"><div class="topbar-inner">
      <div class="brand" data-nav="home">
        <span class="brand-mark">AOT<span class="brand-mark-sub">& stuff</span></span>
      </div>
      <div class="nav">
        <button data-nav="home" class="${state.view==='home'?'active':''}">${ic.home}<span>Home</span></button>
        <button data-nav="search" class="${state.view==='search'?'active':''}">${ic.search}<span>Search</span></button>
        <button data-nav="library" class="${state.view==='library'?'active':''}">${ic.library}<span>Library</span></button>
        <button data-nav="settings" class="${state.view==='settings'?'active':''}">${ic.settings}<span>Settings</span></button>
      </div>
    </div></div>
    <div class="marquee-strip"></div>
    <div class="content" id="content"></div>
  `;
  bindTopbar();
  const pending = renderContent();
  if(shouldPreserve) restoreScrollAfter(pending, scrollY);
}
// The detail view renders in two steps (a loading spinner, then the real content
// once TMDB data resolves). That temporary spinner is much shorter than the real
// page, so the browser clamps the scroll position to the top while it's showing —
// then never puts it back once the real content loads. Waiting for the render to
// actually finish (sync or async) before re-applying the saved scroll position
// fixes that.
function restoreScrollAfter(pending, y){
  const doRestore = ()=> window.scrollTo(0, y);
  if(pending && typeof pending.then === 'function'){
    pending.then(doRestore).catch(doRestore);
  } else {
    requestAnimationFrame(doRestore);
  }
}

function bindTopbar(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.view = el.getAttribute('data-nav');
      if(state.view!=='detail') state.detailKey = null;
      render(false);
    });
  });
}

function renderContent(){
  const c = document.getElementById('content');
  if(state.view==='home') { c.innerHTML = renderHome(); bindHome(); }
  else if(state.view==='search'){ c.innerHTML = renderSearch(); bindSearch(); }
  else if(state.view==='library'){ c.innerHTML = renderLibrary(); bindLibrary(); }
  else if(state.view==='detail'){ c.innerHTML = renderDetailLoading(); return loadDetail(); }
  else if(state.view==='settings'){ c.innerHTML = renderSettings(); bindSettings(); }
}

        <div class="stat"><div class="num">${totalEpWatched}</div><div class="lbl">Episodes watched</div></div>
        <div class="stat"><div class="num">${fmtHours(seriesMinutes)}</div><div class="lbl">Time watched</div></div>
        <div class="stat"><div class="num">${completedShows}</div><div class="lbl">Shows completed</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Movies Stats</h2></div>

function ticketCard(k, it){
  const prog = computeTvProgress(it);
  const nx = nextEpisodeFor(it);

function weekRow(x){

async function refreshUpcoming(){
  state.loading = true; renderContent();

  for(const [k,it] of shows){
    try{
      const d = await getTvDetails(it.id);
      it.nextEpisodeToAir = d.next_episode_to_air || null;
      it.seasonsMeta = (d.seasons||[]).map(s=>({season_number:s.season_number, episode_count:s.episode_count, name:s.name, air_date:s.air_date}));

/* ===================== SEARCH ===================== */
function renderSearch(){
  return `
    <h1 class="view-title">Search</h1>
    <p class="view-sub">Find a show or movie to track</p>
    <div class="searchbar">${ic.search}<input type="text" id="search-input" placeholder="Search TV shows and movies…" value="${escapeHtml(state.searchQuery)}"></div>
    <div id="search-results">${state.loading ? `<div class="spinner"></div>` : renderSearchResults()}</div>
  `;
}
function renderSearchResults(){
  if(!state.searchQuery) return `<div class="empty"><strong>Start typing to search</strong></div>`;
  if(!state.searchResults.length) return `<div class="empty"><strong>No results</strong>Try a different title.</div>`;
  return `<div class="grid">${state.searchResults.map(r=>searchCard(r)).join('')}</div>`;
}
function searchCard(r){
  const type = r.media_type;
  const title = type==='tv' ? r.name : r.title;
  const date = type==='tv' ? r.first_air_date : r.release_date;
  const year = date ? date.slice(0,4) : '—';
  const k = keyOf(type, r.id);
  const inLib = !!state.library[k];
  return `
  <div class="gcard" data-preview='${type}:${r.id}'>
    <div class="gcard-poster" style="background-image:url('${IMG(r.poster_path)}')">
      <span class="gcard-badge">${type==='tv'?'TV':'Movie'}</span>
      ${inLib ? '' : `<button class="gcard-add" data-quickadd='${type}:${r.id}' title="Add to library">+</button>`}
    </div>
    <div class="gcard-title">${escapeHtml(title||'Untitled')}</div>
    <div class="gcard-sub">${year}${inLib? ' · In library':''}</div>
  </div>`;
}
function bindSearch(){
  const input = document.getElementById('search-input');
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  input.addEventListener('input', (e)=>{
    state.searchQuery = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(runSearch, 400);
  });
  bindSearchResultClicks();
}
function bindSearchResultClicks(){
  document.querySelectorAll('[data-preview]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-quickadd]')) return;
      const [type,id] = el.getAttribute('data-preview').split(':');
      openDetail(null, type, id);
    });
  });
  document.querySelectorAll('[data-quickadd]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const [type,id] = el.getAttribute('data-quickadd').split(':');
      const r = state.searchResults.find(x=>String(x.id)===id && x.media_type===type);
      if(r){
        addToLibrary(r, type, 'plan_to_watch');
        toast('Added to your library');
        document.getElementById('search-results').innerHTML = renderSearchResults();
        bindSearchResultClicks();
      }
    });
  });
}
async function runSearch(){
  if(!state.searchQuery){ state.searchResults=[]; document.getElementById('search-results').innerHTML = renderSearchResults(); bindSearchResultClicks(); return; }
  state.loading = true;
  document.getElementById('search-results').innerHTML = `<div class="spinner"></div>`;
  try{
    const data = await searchMulti(state.searchQuery);
    state.searchResults = (data.results||[]).filter(r=>(r.media_type==='tv'||r.media_type==='movie') && (r.poster_path||r.name||r.title));
  }catch(e){
    toast(e.message==='bad-key' ? 'Your TMDB API key seems invalid — check Settings' : 'Search failed, try again');
    state.searchResults = [];
  }
  state.loading = false;
  document.getElementById('search-results').innerHTML = renderSearchResults();
  bindSearchResultClicks();
}

/* ===================== DETAIL ===================== */
function openDetail(libKey, type, id){
  state.view = 'detail';
  state.openSeasons = {};
  if(libKey){
    const it = state.library[libKey];
    state.detailKey = libKey;
    state.detailData = {type: it.type, id: it.id};
  } else {
    state.detailKey = keyOf(type, id);
    state.detailData = {type, id: Number(id)};
  }
  render(false);
}
function renderDetailLoading(){
  return `<button class="back-btn" id="back-btn">${ic.back} Back</button><div class="spinner"></div>`;
}
async function loadDetail(){
  document.getElementById('back-btn').addEventListener('click', ()=>{ history.length; state.view = state.library[state.detailKey] ? 'library':'search'; render(false); });
  const {type, id} = state.detailData;
  const libItem = state.library[state.detailKey];
  try{
    if(type==='tv'){
      const d = await getTvDetails(id);
      if(libItem){
        libItem.seasonsMeta = (d.seasons||[]).map(s=>({season_number:s.season_number, episode_count:s.episode_count, name:s.name, air_date:s.air_date}));
        libItem.nextEpisodeToAir = d.next_episode_to_air || null;
        libItem.showStatus = d.status;
        libItem.lastFetched = Date.now();
        await ensureEpisodesMeta(state.detailKey, id, libItem.seasonsMeta);
        resolveEpisodeRuntimeSource(libItem, d);
        autoUpdateStatus(state.detailKey);
        saveLibrary();
      }
      renderTvDetail(d, libItem);
    } else {
      const d = await getMovieDetails(id);
      if(libItem){
        if(d.runtime){
          libItem.runtime = d.runtime;
          libItem.runtimeSource = 'tmdb';
        } else if(libItem.runtimeSource !== 'manual'){
          libItem.runtime = libItem.runtime || 100;
          libItem.runtimeSource = null; // TMDB has nothing — ask the person
        }
        saveLibrary();
      }
      renderMovieDetail(d, libItem);
    }
  }catch(e){
    document.getElementById('content').innerHTML = `<button class="back-btn" id="back-btn">${ic.back} Back</button><div class="empty"><strong>Couldn't load details</strong>${e.message==='bad-key'?'Check your TMDB API key in Settings.':'Please try again.'}</div>`;
    document.getElementById('back-btn').addEventListener('click', ()=>{ state.view='library'; render(false); });
  }
}

          <div class="punch-row">${Array.from({length:10},(_,i)=>`<button class="punch ${libItem.rating>i?'on':''}" data-punch="${i+1}"></button>`).join('')}</div>
          <span class="punch-num">${libItem.rating? libItem.rating+'/10':'—'}</span>

        </div>

    </div>

    ${libItem ? `<div class="section-head"><h2>Seasons</h2></div>
      <div id="seasons-wrap">${seasons.map(s=>seasonBlock(s, libItem)).join('')}</div>
      <button class="remove-link" id="remove-item">Remove from library</button>`
      : `<div class="empty"><strong>Add this show to your library</strong>to start tracking episodes.</div>`}
  `;
  document.getElementById('content').innerHTML = html;
  bindTvDetail(libItem, d);
}
function seasonBlock(s, libItem){
  const watchedArr = libItem.watched[s.season_number] || [];
  const open = !!state.openSeasons[s.season_number];
  const airedCount = airedCountFor(libItem, s.season_number, s.episode_count);
  const allWatched = airedCount>0 && watchedArr.length >= airedCount;
  const seasonRewatches = (libItem.rewatches && libItem.rewatches[s.season_number]) || {};
  const hasRewatch = Object.values(seasonRewatches).some(n=>n>0);
  return `
  <div class="season ${open?'open':''}" data-season="${s.season_number}">
    <div class="season-head" data-toggle-season="${s.season_number}">
      <div class="season-head-left">
        <span class="chevron">${ic.chevron}</span>
        <h3>${escapeHtml(s.name || 'Season '+s.season_number)}</h3>
        <span class="season-progress-mini">${watchedArr.length}/${airedCount}</span>
      </div>
      <div class="season-actions">
        <button class="mini-btn" data-mark-season="${s.season_number}" data-count="${airedCount}" data-all="${allWatched?1:0}">${allWatched?'Unmark all':'Mark all watched'}</button>
        ${allWatched ? `<button class="rewatch-btn ${hasRewatch?'has-count':''}" data-season-rewatch="${s.season_number}" title="Log a rewatch for this whole season">${ic.rewatch}</button>` : ''}
        ${hasRewatch ? `<button class="rewatch-undo" data-season-rewatch-undo="${s.season_number}" title="Remove one rewatch from this season">−</button>` : ''}
      </div>
    </div>
    <div class="episodes" data-episodes-for="${s.season_number}">
      ${open ? '<div class="spinner" style="margin:16px auto;"></div>' : ''}
    </div>
  </div>`;
}
function bindTvDetail(libItem, tmdbData){
  document.getElementById('back-btn').addEventListener('click', ()=>{ state.view='library'; render(false); });
  const addBtn = document.getElementById('add-lib-tv');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const k = addToLibrary({id:tmdbData.id, name:tmdbData.name, poster_path:tmdbData.poster_path}, 'tv', 'plan_to_watch');
    const it = state.library[k];
    it.seasonsMeta = (tmdbData.seasons||[]).map(s=>({season_number:s.season_number, episode_count:s.episode_count, name:s.name, air_date:s.air_date}));
    it.nextEpisodeToAir = tmdbData.next_episode_to_air || null;
    saveLibrary();
    state.detailKey = k;
    toast('Added to library');
    loadDetail();
  });
  document.querySelectorAll('[data-status]').forEach(el=>{
    el.addEventListener('click', ()=>setStatus(state.detailKey, el.getAttribute('data-status')));
  });
  document.querySelectorAll('[data-punch]').forEach(el=>{
    el.addEventListener('click', ()=>setRating(state.detailKey, Number(el.getAttribute('data-punch'))));
  });
  const rtInput = document.getElementById('episode-runtime');
  if(rtInput) rtInput.addEventListener('change', ()=>setEpisodeRuntime(state.detailKey, rtInput.value));
  document.querySelectorAll('[data-toggle-season]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sn = el.getAttribute('data-toggle-season');
      state.openSeasons[sn] = !state.openSeasons[sn];
      const block = document.querySelector(`.season[data-season="${sn}"]`);
      block.classList.toggle('open');
      if(state.openSeasons[sn]) loadSeasonEpisodes(sn, tmdbData.id, libItem);
    });
  });
  // any season already marked open (e.g. re-rendered after toggling an episode) needs its
  // episode list re-fetched, since the DOM was rebuilt from scratch
  Object.keys(state.openSeasons).filter(sn=>state.openSeasons[sn]).forEach(sn=>{
    loadSeasonEpisodes(sn, tmdbData.id, libItem);
  });
  document.querySelectorAll('[data-mark-season]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const sn = el.getAttribute('data-mark-season');
      const count = Number(el.getAttribute('data-count'));
      const all = el.getAttribute('data-all')==='1';
      markSeasonWatched(state.detailKey, sn, count, all);
    });
  });
  document.querySelectorAll('[data-season-rewatch]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const sn = el.getAttribute('data-season-rewatch');
      logSeasonRewatch(state.detailKey, sn);
      toast('Season rewatch logged');
    });
  });
  document.querySelectorAll('[data-season-rewatch-undo]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const sn = el.getAttribute('data-season-rewatch-undo');
      unlogSeasonRewatch(state.detailKey, sn);
      toast('Removed one season rewatch');
    });
  });
  const rm = document.getElementById('remove-item');
  if(rm) rm.addEventListener('click', ()=>{
    if(confirm('Remove this title from your library? This deletes your watch progress.')){
      removeFromLibrary(state.detailKey);
      state.view = 'library'; render(false);
    }
  });
}
async function loadSeasonEpisodes(sn, showId, libItem){
  const wrap = document.querySelector(`[data-episodes-for="${sn}"]`);
  if(!wrap) return;
  const cached = libItem.episodesMeta && libItem.episodesMeta[sn];
  if(cached && cached.length){
    wrap.innerHTML = cached.map(ep=>episodeRow({...ep, season_number:Number(sn)}, libItem)).join('');
    bindEpisodeRows(libItem);
    return;
  }
  wrap.innerHTML = '<div class="spinner" style="margin:16px auto;"></div>';
  try{
    const sd = await getSeasonDetails(showId, sn);
    libItem.episodesMeta = libItem.episodesMeta || {};
    libItem.episodesMeta[sn] = (sd.episodes||[]).map(ep=>({episode_number:ep.episode_number, air_date:ep.air_date||null, runtime:ep.runtime||null, name:ep.name||null, overview: ep.overview||null, still_path: ep.still_path||null, vote_average: (typeof ep.vote_average==='number' && ep.vote_average>0) ? ep.vote_average : null}));
    resolveEpisodeRuntimeSource(libItem, {episode_run_time: libItem.episodeRuntimeSource==='tmdb' ? [libItem.episodeRuntime] : []});
    saveLibrary();
    wrap.innerHTML = libItem.episodesMeta[sn].map(ep=>episodeRow({...ep, season_number:Number(sn)}, libItem)).join('');
    bindEpisodeRows(libItem);
  }catch(e){
    wrap.innerHTML = `<div class="empty">Couldn't load episodes.</div>`;
  }
}
function episodeRow(ep, libItem){
  const sn = ep.season_number;
  const checked = (libItem.watched[sn]||[]).includes(ep.episode_number);
  const rewatchCount = (libItem.rewatches && libItem.rewatches[sn] && libItem.rewatches[sn][ep.episode_number]) || 0;
  const todayStr = new Date().toISOString().slice(0,10);
  const aired = !!ep.air_date && ep.air_date<=todayStr;
  const lockedOut = !aired && !checked; // can't mark a not-yet-aired episode watched
  let dateLbl;
  if(!ep.air_date){ dateLbl = 'TBA'; }
  else if(aired){ dateLbl = null; }
  else{
    const d = daysUntil(ep.air_date);
    dateLbl = d===0 ? 'Today' : d===1 ? 'Tomorrow' : `in ${d}d`;
  }
  return `
  <div class="episode-row ${lockedOut?'not-aired':''}" data-ep-open="${sn}:${ep.episode_number}">
    <button class="ep-check ${checked?'checked':''}" data-ep-toggle="${sn}:${ep.episode_number}" ${lockedOut?'disabled title="Hasn\'t aired yet"':''}>${ic.check}</button>
    <span class="ep-num">${ep.episode_number}</span>
    <span class="ep-name">${escapeHtml(ep.name||'Episode '+ep.episode_number)}</span>
    <div class="ep-rewatch-wrap">
      <button class="ep-rewatch ${rewatchCount?'has-count':''}" data-ep-rewatch="${sn}:${ep.episode_number}" ${checked?'':'disabled'} title="Log a rewatch">${ic.rewatch}${rewatchCount? '×'+rewatchCount : ''}</button>
      ${rewatchCount ? `<button class="ep-rewatch-undo" data-ep-rewatch-undo="${sn}:${ep.episode_number}" title="Remove one rewatch">−</button>` : ''}
    </div>
    <span class="ep-date${dateLbl ? ' has-label' : ''}">${dateLbl ?? '&nbsp;'}</span>
  </div>`;
}
function bindEpisodeRows(libItem){
  document.querySelectorAll('[data-ep-open]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      const [sn,en] = el.getAttribute('data-ep-open').split(':');
      openEpisodeModal(sn, en);
    });
  });
  document.querySelectorAll('[data-ep-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sn,en] = el.getAttribute('data-ep-toggle').split(':').map(Number);
      toggleEpisode(state.detailKey, sn, en);
      loadDetail();
    });
  });
  document.querySelectorAll('[data-ep-rewatch]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sn,en] = el.getAttribute('data-ep-rewatch').split(':').map(Number);
      logEpisodeRewatch(state.detailKey, sn, en);
      toast('Rewatch logged');
      loadDetail();
    });
  });
  document.querySelectorAll('[data-ep-rewatch-undo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sn,en] = el.getAttribute('data-ep-rewatch-undo').split(':').map(Number);
      unlogEpisodeRewatch(state.detailKey, sn, en);
      toast('Removed one rewatch');
      loadDetail();
    });
  });
}

/* ===================== EPISODE MODAL ===================== */
async function openEpisodeModal(sn, en){
  sn = Number(sn); en = Number(en);
  state.episodeModal = {sn, en};
  renderEpisodeModal();
  const libItem = state.library[state.detailKey];
  if(state.settings.omdbKey && libItem){
    await ensureImdbSeasonRatings(libItem, sn);
    // only re-render if the same episode's modal is still open (user may have closed it)
    if(state.episodeModal && state.episodeModal.sn===sn && state.episodeModal.en===en){
      renderEpisodeModal();
    }
  }
}
function closeEpisodeModal(){
  state.episodeModal = null;
  const el = document.getElementById('episode-modal-overlay');
  if(el) el.remove();
}
function renderEpisodeModal(){
  const {sn, en} = state.episodeModal;
  const libItem = state.library[state.detailKey];
  if(!libItem) return;
  const seasonMeta = libItem.episodesMeta && libItem.episodesMeta[sn];
  const ep = seasonMeta && seasonMeta.find(e=>e.episode_number===en);
  if(!ep) return;

  const runtime = getEpisodeRuntime(libItem, sn, en);

  // Rating: prefer IMDb (via OMDb) when a key is configured, falling back to TMDB's
  // rating if OMDb has no key set, hasn't resolved yet, or has no rating for this episode.
  let ratingHtml = '';
  if(state.settings.omdbKey){
    const seasonRatings = libItem.imdbRatings && libItem.imdbRatings[sn];
    if(seasonRatings === undefined){
      ratingHtml = `<span class="rating-loading">Fetching IMDb rating…</span>`;
    } else if(typeof seasonRatings[en] === 'number'){
      ratingHtml = `<span>IMDb ★ ${seasonRatings[en].toFixed(1)}</span>`;
    } else if(ep.vote_average){
      ratingHtml = `<span>TMDB ★ ${ep.vote_average.toFixed(1)}</span>`;
    }
  } else if(ep.vote_average){
    ratingHtml = `<span>TMDB ★ ${ep.vote_average.toFixed(1)}</span>`;
  }

  const existing = document.getElementById('episode-modal-overlay');
  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'episode-modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <button class="modal-close" id="modal-close-btn">&times;</button>
      ${ep.still_path
        ? `<div class="modal-still" style="background-image:url('${IMG(ep.still_path,'w500')}')"></div>`
        : `<div class="modal-still modal-still-empty">No image</div>`}
      <div class="modal-body">
        <div class="modal-eyebrow">S${sn} · E${en}</div>
        <h2 class="modal-title">${escapeHtml(ep.name || 'Episode '+en)}</h2>
        <div class="modal-meta">
          ${ep.air_date ? `<span>${ep.air_date}</span>` : `<span>TBA</span>`}
          ${runtime ? `<span>${runtime} min</span>` : ''}
          ${ratingHtml}
        </div>
        <p class="modal-overview">${escapeHtml(ep.overview || 'No description available.')}</p>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeEpisodeModal(); });
  document.getElementById('modal-close-btn').addEventListener('click', closeEpisodeModal);
}
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeEpisodeModal(); });

function renderMovieDetail(d, libItem){
  const html = `
    <button class="back-btn" id="back-btn">${ic.back} Back</button>
    <div class="detail-hero">
      <div class="detail-poster" style="background-image:url('${IMG(d.poster_path)}')"></div>
      <div class="detail-info">
        <h1>${escapeHtml(d.title)}</h1>
        <div class="detail-meta">${(d.release_date||'').slice(0,4)||'—'} · ${d.runtime? d.runtime+' min':'—'}</div>
        <div class="genre-pills">${(d.genres||[]).map(g=>`<span class="genre-pill">${escapeHtml(g.name)}</span>`).join('')}</div>
        <div class="detail-overview">${escapeHtml(d.overview||'No overview available.')}</div>

        ${libItem ? `
        <div class="movie-actions">
          <button class="big-toggle ${libItem.status==='completed'?'on':''}" id="movie-watched-toggle">${ic.check} ${libItem.status==='completed'?'Watched':'Mark as Watched'}</button>
          ${libItem.status==='completed' ? `<button class="rewatch-btn ${libItem.rewatchCount?'has-count':''}" id="movie-rewatch-btn">${ic.rewatch} Log a Rewatch${libItem.rewatchCount?' ('+libItem.rewatchCount+')':''}</button>` : ''}
          ${libItem.status==='completed' && libItem.rewatchCount ? `<button class="rewatch-undo" id="movie-rewatch-undo" title="Remove one rewatch">−</button>` : ''}
        </div>
        ${libItem.runtimeSource!=='tmdb' ? `
        <div class="runtime-field">
          <label>Runtime</label>
          <input type="number" min="1" id="movie-runtime" value="${libItem.runtime||d.runtime||100}">
          <span>min — TMDB doesn't have a runtime for this movie, so set one to estimate your time watched</span>
        </div>
        ` : ''}
        <div class="punchcard">
          <span class="punchcard-label">Rating</span>
          <div class="punch-row">${Array.from({length:10},(_,i)=>`<button class="punch ${libItem.rating>i?'on':''}" data-punch="${i+1}"></button>`).join('')}</div>
          <span class="punch-num">${libItem.rating? libItem.rating+'/10':'—'}</span>
        </div>
        <button class="remove-link" id="remove-item">Remove from library</button>
        ` : `<div class="status-row"><button class="btn" id="add-lib-movie">+ Add to Library</button></div>`}
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
  document.getElementById('back-btn').addEventListener('click', ()=>{ state.view='library'; render(false); });
  const addBtn = document.getElementById('add-lib-movie');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const k = addToLibrary({id:d.id, title:d.title, poster_path:d.poster_path}, 'movie', 'plan_to_watch');
    state.detailKey = k;
    toast('Added to library');
    loadDetail();
  });
  const wt = document.getElementById('movie-watched-toggle');
  if(wt) wt.addEventListener('click', ()=>{
    const it = state.library[state.detailKey];
    const wasCompleted = it.status === 'completed';
    it.status = wasCompleted ? 'plan_to_watch' : 'completed';
    it.watchedAt = it.status==='completed' ? Date.now() : null;
    if(wasCompleted) it.rewatchCount = 0; // no longer marked watched, so its rewatches don't count either
    saveLibrary(); loadDetail();
  });
  const rwBtn = document.getElementById('movie-rewatch-btn');
  if(rwBtn) rwBtn.addEventListener('click', ()=>{ logMovieRewatch(state.detailKey); toast('Rewatch logged'); loadDetail(); });
  const rwUndoBtn = document.getElementById('movie-rewatch-undo');
  if(rwUndoBtn) rwUndoBtn.addEventListener('click', ()=>{ unlogMovieRewatch(state.detailKey); toast('Removed one rewatch'); loadDetail(); });
  const mrInput = document.getElementById('movie-runtime');
  if(mrInput) mrInput.addEventListener('change', ()=>{ setMovieRuntime(state.detailKey, mrInput.value); loadDetail(); });
  document.querySelectorAll('[data-punch]').forEach(el=>{
    el.addEventListener('click', ()=>{ setRating(state.detailKey, Number(el.getAttribute('data-punch'))); loadDetail(); });
  });
  const rm = document.getElementById('remove-item');
  if(rm) rm.addEventListener('click', ()=>{
    if(confirm('Remove this title from your library?')){
      removeFromLibrary(state.detailKey);
      state.view='library'; render(false);
    }
  });
}

/* ===================== SETTINGS ===================== */
function renderSettings(){
  return `
    <h1 class="view-title">Settings</h1>
    <p class="view-sub">Your data is stored in your local browser. It is thus recommended to frequently back it up below, specially before removing cache or updates.</p>

    <div class="settings-card">
      <h3>Export your library</h3>
      <p>Download everything you're tracking as a JSON file, for backup or moving devices.</p>
      <div class="row-btns">
        <button class="btn secondary" id="export-btn">Export JSON</button>
        <label class="btn secondary" style="display:inline-block;">Import JSON<input type="file" id="import-input" accept="application/json" style="display:none;"></label>
      </div>
    </div>

    <div class="settings-card">
      <h3>Danger zone</h3>
      <p>This clears every title, status and rating you've tracked. This can't be undone.</p>
      <button class="btn danger" id="clear-all">Clear all library data</button>
    </div>
  `;
}
function bindSettings(){
  document.getElementById('export-btn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state.library, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'stubs-library.json'; a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('import-input').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        state.library = {...state.library, ...data};
        await saveLibrary();
        toast('Library imported');
        render();
      }catch(err){ toast('Invalid file'); }
    };
    reader.readAsText(file);
  });
  document.getElementById('clear-all').addEventListener('click', async ()=>{
    if(confirm('Delete your entire library? This cannot be undone.')){
      state.library = {};
      await saveLibrary();
      toast('Library cleared');
      render();
    }
  });
}

/* ===================== UTIL ===================== */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ===================== BOOT ===================== */
(async function boot(){
  await loadState();
  render();
})();

// PWA: register service worker for offline support + home-screen install
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{/* offline support just won't be available */});
  });
}
